name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # access key to the public downloads repository (repository secret); without it only this repo gets the release
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.16.0 pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Stamp build number
        shell: bash
        run: sed -i "s/^BUILD = .*/BUILD = ${{ github.run_number }}/" fsapp/version.py
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name FinancialStatements --add-data "sample;sample" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialStatements-windows
          path: dist/FinancialStatements
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/FinancialStatements -DestinationPath FinancialStatements-windows.zip
          git log -1 --pretty=%B | Out-File -Encoding utf8 notes.txt
          gh release create "build-${{ github.run_number }}" FinancialStatements-windows.zip `
            --title "نسخة رقم ${{ github.run_number }}" --notes-file notes.txt --target "${{ github.sha }}"
      - name: Publish to downloads repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.RELEASES_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.RELEASES_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" FinancialStatements-windows.zip `
            -R gamalelsayed-hub/financial-statements-releases --title "نسخة رقم ${{ github.run_number }}" --notes-file notes.txt
