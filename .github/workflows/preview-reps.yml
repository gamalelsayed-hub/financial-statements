name: Preview reps screen (temporary)
on:
  push:
    branches: [feature/sales-reps]
jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_reps.py
      - run: python preview_reps.py preview
      - uses: actions/upload-artifact@v4
        with:
          name: reps-preview
          path: preview/*.png
